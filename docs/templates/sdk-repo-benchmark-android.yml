# Copy to backtrace-android/.github/workflows/benchmark.yml.
# Base (merge-base) and head are published to mavenLocal from the same checkout and benchmarked in the SAME job,
# interleaved with a sentinel, so the PR comment compares like with like. Stored results are never a gate reference.
name: benchmark

on:
  pull_request:
    paths: ["backtrace-library/**", "gradle/**", "*.gradle", ".github/workflows/benchmark.yml"]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    outputs:
      trusted: ${{ steps.classify.outputs.trusted }}
    steps:
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          trusted=false
          if [ "$EVENT_NAME" != "pull_request" ] || { [ "$HEAD_REPOSITORY" = "$REPOSITORY" ] && [ "$ACTOR" != "dependabot[bot]" ]; }; then trusted=true; fi
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: policy
    if: needs.policy.outputs.trusted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HARNESS_REPO: melekr/backtrace-benchmarks
      HARNESS_SHA: <pin the harness commit sha here>
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sdk-src
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.HARNESS_REPO }}
          ref: ${{ env.HARNESS_SHA }}
          path: harness
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet -r harness/scripts/requirements.txt
      - name: Publish base and head to mavenLocal
        working-directory: harness
        run: |
          set -euo pipefail
          BASE=$(git -C ../sdk-src merge-base HEAD origin/master 2>/dev/null || git -C ../sdk-src rev-parse HEAD~1)
          scripts/ci/publish_android_local.sh ../sdk-src "$BASE" base
          scripts/ci/publish_android_local.sh ../sdk-src HEAD head
          echo "VERSIONS=$(cat out/local-version-base.txt),$(cat out/local-version-head.txt)" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Environment fingerprint
        working-directory: harness
        run: scripts/env_fingerprint.sh --set tier=tier1 --set emulator="system-images;android-34;google_apis;x86_64" > env.json
      - name: Build variants and measure size
        working-directory: harness
        env: { SOURCE: local, ROUNDS: "3", ITERATIONS: "15", METRIC_SETS: "size,init,micro", SCENARIO: default, OUT: out/android }
        run: scripts/ci/lane_android.sh build
      - name: Run ladder on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          working-directory: harness
          script: SOURCE=local ROUNDS=3 ITERATIONS=15 METRIC_SETS=size,init,micro SCENARIO=default OUT=out/android scripts/ci/lane_android.sh run
      - name: Compare (gate) and render comment
        id: compare
        working-directory: harness
        env: { SOURCE: local, OUT: out/android, GATE: "1" }
        run: |
          set -o pipefail
          scripts/ci/lane_android.sh report | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        with:
          header: backtrace-benchmarks
          path: harness/out/android/report/pr-comment.md
