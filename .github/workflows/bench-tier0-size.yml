name: bench-tier0-size

# Size ladders from published artifacts only: no build, no device, no licence.
on:
  workflow_dispatch:
    inputs:
      sdk:
        description: "android | apple | unity | all"
        default: all
        type: choice
        options: [all, android, apple, unity]
      android_versions:
        description: "Comma-separated Maven Central versions"
        default: "3.8.4,3.9.0,3.10.6,3.11.0,3.13.0,3.14.0"
      apple_versions:
        description: "Comma-separated release tags with XCFramework archives"
        default: "2.0.6,2.0.9,2.1.0,2.2.0"
      unity_versions:
        description: "Comma-separated OpenUPM versions"
        default: "3.13.0,3.14.1,3.15.1,3.16.2,3.17.0"
  schedule:
    - cron: "0 3 * * 1"
  repository_dispatch:
    types: [sdk-release]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tier0:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SDK: ${{ inputs.sdk || 'all' }}
      ANDROID_VERSIONS: ${{ inputs.android_versions || '3.8.4,3.9.0,3.10.6,3.11.0,3.13.0,3.14.0' }}
      APPLE_VERSIONS: ${{ inputs.apple_versions || '2.0.6,2.0.9,2.1.0,2.2.0' }}
      UNITY_VERSIONS: ${{ inputs.unity_versions || '3.13.0,3.14.1,3.15.1,3.16.2,3.17.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install harness requirements
        run: python3 -m pip install --quiet -r scripts/requirements.txt
      - name: Tier-0 size ladders
        run: |
          set -o pipefail
          scripts/ci/lane_tier0.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Validate rows
        run: python3 scripts/validate_rows.py out/tier0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: rows-tier0-${{ github.run_id }}
          path: out/tier0
          if-no-files-found: error
          retention-days: 30
